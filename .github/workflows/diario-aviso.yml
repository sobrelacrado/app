# Aviso diario del Diario ("ya está el acertijo de hoy") a los móviles suscritos.
# Se lanza a las 06:00 y 07:00 UTC; el programa solo envía cuando son las 8:00 en Madrid (verano e invierno).
name: Aviso diario

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Enviar ahora aunque no sean las 8:00 (para probar)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/send-diario-push.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE: ${{ inputs.forzar && '1' || '0' }}
