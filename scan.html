<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sobre Lacrado</title>
    <style>
      body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      main.hoja { width: calc(100% - 32px); max-width: 380px; margin: 16px; padding: 28px 24px; text-align: center; }
      main .logo { font-family: var(--titulo); letter-spacing: 5px; font-size: 18px;
        border-bottom: 3px double var(--linea); padding-bottom: 8px; margin-bottom: 18px; }
      main h1 { font-size: 1.15rem; letter-spacing: 2px; margin-bottom: 8px; }
      main p { line-height: 1.4; }
      input { width: 100%; padding: 12px; margin-top: 12px; font: inherit; font-size: 1rem;
        background: #fff; border: 1px solid var(--linea); color: var(--tinta); }
      main button, main a.btn { width: 100%; margin-top: 12px; padding: 14px; display: block; text-align: center;
        text-decoration: none; }
      main a.btn { font-family: var(--titulo); letter-spacing: 1.5px; text-transform: uppercase; font-size: 13px;
        background: var(--rojo); color: var(--papel); border: 2px solid var(--rojo); }
    </style>
  </head>
  <body>
    <main id="app" class="hoja"><p>…</p></main>
    <script type="module" src="/src/scan/scan.js"></script>
  </body>
</html>
